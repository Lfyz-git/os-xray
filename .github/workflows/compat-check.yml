name: Core checks

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          sh -n install.sh
          find plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('plugin/mvc/app/views/OPNsense/Xray/partials/outbounds_editor.volt', 'utf8')
            .replace(/^<script>\s*|\s*<\/script>\s*$/g, '');
          new Function(src);
          NODE
      - name: Candidate generation
        run: python3 tests/behavioral_config_test.py && python3 tests/behavioral_candidate_test.py
