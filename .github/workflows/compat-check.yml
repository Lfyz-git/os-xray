name: Core checks

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          sh -n install.sh
          sh -n upgrade.sh
          sh -n plugin/etc/rc.syshook.d/start/50-xray
          find plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('plugin/mvc/app/models/OPNsense/Xray').glob('*.xml'):
              ET.parse(path)
          # Native GUI: six sidebar destinations, General first and visible,
          # and a disabled-master warning which refreshes from the saved API.
          menu = ET.parse('plugin/mvc/app/models/OPNsense/Xray/Menu/Menu.xml')
          links = menu.findall('./VPN/Xray/*')
          assert [x.tag for x in links] == [
              'General', 'Instances', 'Subscriptions', 'Diagnostics', 'Log', 'Advanced']
          view = pathlib.Path('plugin/mvc/app/views/OPNsense/Xray/general.volt').read_text()
          assert '<li class="active"><a data-toggle="tab" href="#general">' in view
          inst = pathlib.Path('plugin/mvc/app/views/OPNsense/Xray/partials/tab_instances.volt').read_text()
          js = pathlib.Path('plugin/mvc/app/views/OPNsense/Xray/partials/scripts.volt').read_text()
          assert 'id="xrayGlobalDisabledNotice"' in inst
          assert "url: '/api/xray/general/get'" in js
          assert "syncGlobalStartControls()" in js
          assert "on('hashchange', activateXrayTabFromHash)" in js
          hook = pathlib.Path('packaging/native/+POST_INSTALL.post').read_text()
          build = pathlib.Path('packaging/native/build.sh').read_text()
          assert '/tmp/opnsense_menu_cache.xml' in hook
          assert 'cp "$ROOT/packaging/native/+POST_INSTALL.post"' in build
          PY
          node - <<'NODE'
          const fs = require('fs');
          for (const name of ['subscriptions_ui', 'tab_subscriptions', 'tab_advanced']) {
            const path = 'plugin/mvc/app/views/OPNsense/Xray/partials/' + name + '.volt';
            const src = fs.readFileSync(path, 'utf8');
            if (name === 'subscriptions_ui')
              new Function(src.replace(/^<script>\s*|\s*<\/script>\s*$/g, ''));
          }
          NODE
      - name: Existing lifecycle safety regressions
        run: |
          python3 tests/behavioral_stop_test.py
          python3 tests/behavioral_actions_test.py
          python3 tests/behavioral_candidate_test.py
          python3 tests/behavioral_process_identity_test.py
          python3 tests/behavioral_lock_test.py
      - name: Candidate generation and subscription import
        run: |
          python3 tests/behavioral_config_test.py
          php tests/subscriptions_smoke_test.php
