name: Publish signed os-xray test repository

# Push runs only an isolated signature/catalogue smoke check.
# Deployment is manual; an ordinary push never publishes anything.
on:
  push:
    branches:
      - feature/native-pkg-test-repository
    paths:
      - 'packaging/repository/**'
      - '.github/workflows/publish-native-test-repo.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: os-xray-test-pages
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: Build and sign FreeBSD packages
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Require key for public publishing only
        if: github.event_name == 'workflow_dispatch'
        env:
          OS_XRAY_REPO_KEY_B64: ${{ secrets.OS_XRAY_REPO_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OS_XRAY_REPO_KEY_B64" || { echo "::error::Missing OS_XRAY_REPO_KEY_B64 Actions secret"; exit 1; }
          # Check that the stored secret is a complete Base64-encoded RSA
          # private key before starting the expensive FreeBSD VM build.
          # Never print the decoded key, its Base64 representation, or fingerprints.
          if ! (printf '%s' "$OS_XRAY_REPO_KEY_B64" | base64 --decode | openssl rsa -check -noout >/dev/null 2>&1); then
            echo "::error::OS_XRAY_REPO_KEY_B64 is not a valid Base64-encoded RSA private key. Replace the repository Actions secret with the exact output of: openssl base64 -A -in os-xray-repo.key"
            exit 1
          fi
      - name: Checkout repository infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || 'feature/native-pkg-test-repository' }}
          path: infrastructure
      - name: Checkout native package draft
        uses: actions/checkout@v4
        with:
          ref: feature/native-core-package-ui
          path: source
      - name: Checkout OPNsense plugin build system
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: opnsense/plugins
          ref: master
          path: source/opnsense-plugins
      # Reuse a successful, immutable native package build rather than
      # rebuilding on every publish (which depends on FreeBSD pkg mirrors).
      - name: Select verified native package build
        if: github.event_name == 'workflow_dispatch'
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git -C source rev-parse HEAD)
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs" --method GET \
            -f head_sha="$SOURCE_SHA" -f per_page=100)
          RUN_ID=$(jq -r --arg sha "$SOURCE_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "feature/native-core-package-ui" and .name == "Build native OPNsense packages" and .conclusion == "success")] | first | .id // empty' <<< "$RUNS")
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::No successful native-package.yml build found for source commit $SOURCE_SHA. Run the native package workflow first."
            exit 1
          fi
          echo "Selected verified native package build: $RUN_ID ($SOURCE_SHA)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download verified native packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: os-xray-freebsd15-amd64
          path: source/dist
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Check downloaded package filenames
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test -s source/dist/os-xray-3.3.0.pkg
          test -s source/dist/xray-tun2socks-2.7.0.pkg
      - name: Build packages and sign repository in FreeBSD 15.1
        env:
          OS_XRAY_REPO_KEY_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.OS_XRAY_REPO_KEY_B64 || '' }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          envs: OS_XRAY_REPO_KEY_B64 GITHUB_EVENT_NAME
          # Package dependencies are only needed for the ephemeral push smoke build.
          # Publishing reuses a verified package artifact and needs only base pkg/openssl.
          prepare: ${{ github.event_name != 'workflow_dispatch' && 'pkg install -y ca_root_nss unzip php85 php85-curl xray-core' || '' }}
          run: |
            set -eu
            if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
              sh source/packaging/native/build.sh
              # Disposable signing key verifies the pipeline, never published.
              umask 077
              openssl genrsa -out /tmp/os-xray-ci-private.key 3072
              OS_XRAY_REPO_KEY_B64=$(openssl base64 -A -in /tmp/os-xray-ci-private.key)
              export OS_XRAY_REPO_KEY_B64
              trap 'rm -f /tmp/os-xray-ci-private.key' EXIT
            fi
            sh infrastructure/packaging/repository/build-signed-site.sh source/dist site
      - name: Pack signed repository for inspection
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          # The real FreeBSD ABI directory contains colons (FreeBSD:15:amd64).
          # upload-artifact rejects such paths, so wrap the entire site in a tarball.
          tar -czf os-xray-test-signed-repo.tar.gz -C site .
          test -s os-xray-test-signed-repo.tar.gz
          tar -tzf os-xray-test-signed-repo.tar.gz > repo-tar-contents.txt
          grep -Fxq './FreeBSD:15:amd64/26.7/test/repo/os-xray-3.3.0.pkg' repo-tar-contents.txt
          grep -Fxq './FreeBSD:15:amd64/26.7/test/repo/xray-tun2socks-2.7.0.pkg' repo-tar-contents.txt
          grep -Fxq './Keys/repo.pub' repo-tar-contents.txt
      - name: Preserve signed packages for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: os-xray-test-signed-freebsd15-amd64
          path: os-xray-test-signed-repo.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages site
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    if: github.event_name == 'workflow_dispatch'
    name: Deploy signed repository to GitHub Pages
    needs: build-and-sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
