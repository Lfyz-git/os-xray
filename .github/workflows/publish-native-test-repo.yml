name: Publish signed os-xray test repository

# Manual only: never publish an untested plugin automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-xray-test-pages
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: Build and sign FreeBSD packages
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OS_XRAY_REPO_KEY_B64: ${{ secrets.OS_XRAY_REPO_KEY_B64 }}
    steps:
      - name: Require package signing key
        shell: bash
        run: |
          test -n "$OS_XRAY_REPO_KEY_B64" || { echo "Missing OS_XRAY_REPO_KEY_B64 secret"; exit 1; }
      - name: Checkout repository infrastructure
        uses: actions/checkout@v4
        with:
          ref: main
          path: infrastructure
      - name: Checkout native package draft
        uses: actions/checkout@v4
        with:
          ref: feature/native-core-package-ui
          path: source
      - name: Checkout OPNsense plugin build system
        uses: actions/checkout@v4
        with:
          repository: opnsense/plugins
          ref: master
          path: source/opnsense-plugins
      - name: Build packages and sign repository in FreeBSD 15.1
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          envs: OS_XRAY_REPO_KEY_B64
          prepare: |
            pkg install -y ca_root_nss unzip php85 php85-curl xray-core
          run: |
            set -eu
            sh source/packaging/native/build.sh
            sh infrastructure/packaging/repository/build-signed-site.sh source/dist site
      - name: Preserve signed packages for inspection
        uses: actions/upload-artifact@v4
        with:
          name: os-xray-test-signed-freebsd15-amd64
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    name: Deploy signed repository to GitHub Pages
    needs: build-and-sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
