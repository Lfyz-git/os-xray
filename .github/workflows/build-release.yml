name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Triggered by New Tag event
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and create archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Prepare release archive
        run: |
          ARCHIVE_DIR="opnsense-xray"
          ARCHIVE_NAME="opnsense-xray-${{ steps.version.outputs.VERSION }}"
          mkdir -p "${ARCHIVE_DIR}"

          # Копируем все файлы, необходимые для ручной установки.
          # Исключаем служебные каталоги (.git, .github) и сам каталог архива.
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude="${ARCHIVE_DIR}" \
            . "${ARCHIVE_DIR}/"

          # Создаём .tar.gz архив
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_DIR}"

          echo "ARCHIVE_DIR=${ARCHIVE_DIR}" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      #- name: Debug git info
      #  run: |
      #    echo "=== All tags ==="
      #    git tag --sort=-v:refname
      #    echo ""
      #    echo "=== Commit count ==="
      #    git rev-list --count HEAD

      - name: Prepare release notes
        run: |
          NOTES="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ ! -s "$NOTES" ]; then
            echo "Missing non-empty release notes: $NOTES" >&2
            exit 1
          fi
          cp "$NOTES" "$RUNNER_TEMP/os-xray-release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "opnsense-xray ${{ steps.version.outputs.VERSION }}"
          body_path: ${{ runner.temp }}/os-xray-release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-rc') || contains(steps.version.outputs.VERSION, '-beta') || contains(steps.version.outputs.VERSION, '-alpha') }}
          files: |
            ${{ env.ARCHIVE_NAME }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}